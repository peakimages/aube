name: Tests

on:
  workflow_call:
    inputs:
      lines:
        description: The upstream lines the build workflow built as JSON
        type: string
        required: true

permissions: {}

cache-mode: none

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint repository
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lint the repository
        run: scripts/lint.sh

      - name: Verify the action lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        # https://github.com/github/gh-actions-lock/releases/tag/v0.4.1
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify

  test:
    name: Test image (${{ matrix.line.name }}, ${{ matrix.flavor }}, ${{ matrix.platform }})
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(inputs.lines) }}
        flavor: [default, node22, node24, node26]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download the image
        uses: actions/download-artifact@v8.0.2
        with:
          name: image-${{ matrix.line.name }}-${{ matrix.flavor }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image

      - name: Load the image
        run: tar -cf - -C "$RUNNER_TEMP/image" . | docker load

      - name: Test the image
        run: scripts/test.sh peakimages/aube:test
